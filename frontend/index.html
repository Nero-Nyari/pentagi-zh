<!doctype html>
<html
    lang="en"
    translate="no"
>
    <head>
        <meta charset="UTF-8" />
        <!-- The UI translates itself (see `src/lib/i18n`), so browser
             auto-translation is both redundant and harmful: it swaps text nodes
             React owns, which is a known source of DOM desync. Opt the document
             out of it. Defense-in-depth only: the route errorElement recovers
             from such desyncs (extension or translation) regardless of source. -->
        <meta
            name="google"
            content="notranslate"
        />

        <!-- Stamp <html lang> before React mounts, so the very first paint already
             carries the right value — font fallback, hyphenation, and the
             browser's own translate prompt all key off it. Mirrors the
             stored-else-detected rule in LanguageProvider, which takes over and
             keeps it in step once mounted. `lang="en"` above stays as the
             no-JavaScript default. -->
        <script>
            (function () {
                try {
                    var stored = JSON.parse(localStorage.getItem('language') || 'null');
                    var language = stored === 'en' || stored === 'zh' ? stored : null;

                    if (!language) {
                        var preferred = navigator.languages || [navigator.language];
                        language = 'en';

                        for (var index = 0; index < preferred.length; index += 1) {
                            if (String(preferred[index]).toLowerCase().indexOf('zh') === 0) {
                                language = 'zh';
                                break;
                            }
                        }
                    }

                    document.documentElement.lang = language;
                } catch (error) {
                    /* storage unavailable in this context — the provider's default applies */
                }
            })();
        </script>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>PentAGI</title>

        <link
            rel="icon"
            type="image/png"
            href="/favicon/favicon-96x96.png"
            sizes="96x96"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon/favicon.svg"
        />
        <link
            rel="shortcut icon"
            href="/favicon/favicon.ico"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon/apple-touch-icon.png"
        />
        <link
            rel="manifest"
            href="/favicon/site.webmanifest"
        />

        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/inter-regular.woff2"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/inter-500.woff2"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/inter-600.woff2"
            crossorigin="anonymous"
        />
        <link
            rel="preload"
            as="font"
            type="font/woff2"
            href="/fonts/inter-700.woff2"
            crossorigin="anonymous"
        />
    </head>

    <body class="bg-background font-sans antialiased">
        <div id="root"></div>
        <script
            type="module"
            src="/src/main.tsx"
        ></script>
    </body>
</html>
